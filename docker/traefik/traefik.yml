# Traefik v3 — static configuration
# گواهی‌ها از certbot موجود روی هاست خوانده می‌شوند (ACME داخلی Traefik خاموش است)

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    # ریدایرکت خودکار HTTP → HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    # pakhshemoon.ir پشت Cloudflare است؛ IP واقعی کاربر از این هدرها خوانده شود
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

  websecure:
    address: ":443"
    http:
      tls: {}
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false      # فقط کانتینرهایی که لیبل traefik.enable=true دارند
    network: web
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true
