# استک repert-robot
#   docker compose build && docker compose up -d
#
# شبکه‌ها:
#   internal — ارتباط داخلی app ↔ nginx ↔ mysql (بدون دسترسی خارجی)
#   web      — فقط nginx به آن وصل است تا Traefik بتواند به آن برسد

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: repert-robot:latest
    container_name: repert-app
    restart: always
    env_file: .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # فایل‌های آپلودی و لاگ‌ها باید بین بیلدها باقی بمانند
      - repert_storage:/var/www/html/storage/app
      - repert_logs:/var/www/html/storage/logs
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: repert-robot-web:latest
    container_name: repert-nginx
    restart: always
    depends_on: [app]
    volumes:
      # فقط فایل‌های آپلودی؛ بقیه‌ی public داخل خود ایمیج است
      - repert_storage:/var/www/html/storage/app:ro
    networks: [internal, web]

  # زمان‌بند لاراول — بدون این سرویس هیچ کار زمان‌بندی‌شده‌ای اجرا نمی‌شود:
  #   broadcast:send-due    (پیام‌های همگانی)
  #   subscriptions:expire  (انقضای اشتراک و برداشتن وبهوک ربات)
  # از همان ایمیج app استفاده می‌کند و migrate اجرا نمی‌کند (entrypoint فقط برای php-fpm
  # مرحله‌ی آماده‌سازی را اجرا می‌کند)، پس با app تداخل ندارد.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: repert-robot:latest
    container_name: repert-scheduler
    restart: always
    env_file: .env.docker
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - repert_storage:/var/www/html/storage/app
      - repert_logs:/var/www/html/storage/logs
    networks: [internal]

  mysql:
    image: mysql:8.4
    container_name: repert-mysql
    restart: always
    # نکته: --default-authentication-plugin در MySQL 8.4 حذف شده است
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - repert_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

volumes:
  repert_mysql:
  repert_storage:
  repert_logs:

networks:
  internal:
    driver: bridge
  web:
    external: true
